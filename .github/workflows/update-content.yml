name: Update Content (News + Instagram)

on:
  schedule:
    # Meio-dia horario de Brasilia (UTC-3) = 15:00 UTC
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # necessario para disparar o workflow de deploy ao final
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch fresh content
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: node scripts/update-content.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git add public/images/instagram-*.jpg 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No content changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update daily content (news + youtube + instagram)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Push feito com o GITHUB_TOKEN nao dispara outros workflows (regra anti-recursao
      # do GitHub Actions). Sem esta chamada o conteudo entra no repositorio mas nunca
      # chega ao site publicado.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
